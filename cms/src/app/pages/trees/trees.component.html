<cub-card class="mb-24"
  ><cub-card-header
    >種樹點目錄
    <div
      cubEnd
      class="d-flex g-8">
      <input
        cubInput
        [ngModel]="vm.search()"
        (ngModelChange)="vm.search.set($event)"
        placeholder="搜尋種樹點" /><button
        cub-button
        appearance="filled-outline"
        (click)="vm.edit('trees')">
        新增種樹點
      </button>
    </div></cub-card-header
  ><cub-card-content
    ><cub-table
      [value]="vm.rows()"
      [paginator]="true"
      [pageIndex]="0"
      [pageSize]="30"
      ><ng-template cubTemplate="header"
        ><tr>
          <th>名稱</th>
          <th>識別碼</th>
          <th>位置</th>
          <th>狀態</th>
          <th>操作</th>
        </tr></ng-template
      ><ng-template
        cubTemplate="body"
        let-item
        ><tr>
          <td>
            <b>{{ item.name }}</b>
          </td>
          <td>{{ item.id }}</td>
          <td>{{ item.postalCode }} {{ item.place }}</td>
          <td>{{ item.empty ? '可種植' : '既有展示樹木' }}</td>
          <td>
            <button
              cub-button
              (click)="vm.edit('trees', item)">
              編輯</button
            ><button
              cub-button
              (click)="vm.remove('trees', item.id)">
              刪除
            </button>
          </td>
        </tr></ng-template
      ></cub-table
    ></cub-card-content
  ></cub-card
>
