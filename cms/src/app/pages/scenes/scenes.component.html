<cub-card class="mb-24"><cub-card-header>場景目錄<div cubEnd class="d-flex g-8"><input cubInput [ngModel]="vm.search()" (ngModelChange)="vm.search.set($event)" placeholder="搜尋場景" /><button cub-button appearance="filled-outline" (click)="vm.edit('scenes')">新增場景</button></div></cub-card-header><cub-card-content><cub-table [value]="vm.rows()"><ng-template cubTemplate="header"><tr><th>名稱</th><th>識別碼</th><th>場景條件</th><th>來源</th><th>操作</th></tr></ng-template><ng-template cubTemplate="body" let-item><tr><td><b>{{ item.name }}</b></td><td>{{ item.id }}</td><td>{{ item.weather }} / {{ item.timeOfDay }}</td><td>Demo</td><td><button cub-button (click)="vm.edit('scenes', item)">編輯</button><button cub-button (click)="vm.remove('scenes', item.id)">刪除</button></td></tr></ng-template></cub-table></cub-card-content></cub-card>
