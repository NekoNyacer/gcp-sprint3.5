<cub-card class="mb-24"
  ><cub-card-content>
    <div class="mb-24"><button cub-button appearance="filled-outline" [disabled]="vm.busy()" (click)="vm.loadExpandedSeed()">合併台北市／板橋擴充站點與種子機率池</button>
    <p>僅新增缺少的識別碼，保留現有內容與營運編輯。合併後仍須儲存、發布。</p></div>
    <div class="d-flex flex-wrap mb-24">
      <cub-upload
        #seedUpload
        appearance="button"
        uploadLabel="匯入既有 mock 種子"
        [acceptableMimeTypes]="['application/json']"
        [maxFileSize]="850000"
        [disabled]="vm.busy()"
        (validationSuccess)="vm.importSeed($event); seedUpload.reset()"
        (validationFailed)="vm.error.set('請選擇不超過 850 KB 的 JSON 種子檔')"></cub-upload>
    </div>
    <div class="d-flex flex-col">
      <a
        class="d-block"
        cub-hyperlink
        href="cms-demo.json"
        download
        >下載種子檔</a
      >
      <p>匯入後僅會修改草稿，不會覆寫玩家進度。</p>
    </div>
  </cub-card-content></cub-card
>
