<app-dialog />

@if (!isInHomeTab()) {
  <ion-header class="ion-no-border">
    <ion-toolbar [class.profile-toolbar]="isProfileRoot()">
      <div class="toolbar-row">
        @if (isProfileRoot()) {
          <app-profile-identity />
        } @else {
          <ion-buttons [class.back-button-hidden]="!showBackButton()">
            <ion-button (click)="goToParentRoute()" aria-label="??" class="arrow-back">
              <ion-icon slot="icon-only" name="chevron-back-outline" />
            </ion-button>
          </ion-buttons>
          <ion-title>{{ headerTxt() }}</ion-title>
        }
      </div>
    </ion-toolbar>
  </ion-header>
}

<ion-tabs id="main-content" [class.home-map-screen]="currentUrl() === '/home'">
  @if (hasTabBar()) {
    <ion-tab-bar slot="bottom" [animate.leave]="'tab-bar-descend'" [animate.enter]="'tab-bar-rise'">
      <ion-tab-button tab="home">
        <ion-icon
          [name]="currentUrl() === '/home' ? 'navigate-circle' : 'navigate-circle-outline'"
        />
        <ion-label>健走</ion-label>
        <ion-badge color="danger"></ion-badge>
      </ion-tab-button>

      <ion-tab-button tab="task">
        <ion-icon [name]="currentUrl() === '/task' ? 'receipt' : 'receipt-outline'" />
        <ion-label>任務</ion-label>
        @if (taskStore.incompleteTaskCount() > 0) {
          <ion-badge color="danger">{{ taskStore.incompleteTaskCount() }}</ion-badge>
        }
      </ion-tab-button>
      <ion-tab-button tab="shop">
        <ion-icon [name]="currentUrl() === '/shop' ? 'gift' : 'gift-outline'" />
        <ion-label>兌換</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="collection">
        <ion-icon [name]="currentUrl() === '/collection' ? 'leaf' : 'leaf-outline'" />
        <ion-label>回憶</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile">
        <ion-icon [name]="currentUrl() === '/profile' ? 'person' : 'person-outline'" />
        <ion-label>我的</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  }
</ion-tabs>

<!-- 底部彈窗 -->
<cub-modal />
