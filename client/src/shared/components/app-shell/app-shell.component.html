<app-dialog />
<app-task-reward-dialog />

@if (!isInHomeTab()) {
  <ion-header class="ion-no-border">
    <ion-toolbar [class.profile-toolbar]="isProfileRoot()">
      <div class="toolbar-row">
        @if (isProfileRoot()) {
          <app-profile-identity />
        } @else {
          <ion-buttons [class.back-button-hidden]="!showBackButton()">
            <ion-button (click)="goToParentRoute()" aria-label="??" class="arrow-back">
              <ion-icon slot="icon-only" name="chevron-back-outline" />
            </ion-button>
          </ion-buttons>
          <ion-title>{{ headerTxt() }}</ion-title>
        }
      </div>
    </ion-toolbar>
  </ion-header>
}

<ion-tabs id="main-content" [class.home-map-screen]="currentUrl() === '/home'">
  @if (hasTabBar()) {
    <ion-tab-bar #petFloor slot="bottom" [animate.leave]="'tab-bar-descend'" [animate.enter]="'tab-bar-rise'">
      <ion-tab-button tab="home">
        <ion-icon
          [name]="currentUrl() === '/home' ? 'navigate-circle' : 'navigate-circle-outline'"
        />
        <ion-label>健走</ion-label>
        <!-- <ion-badge color="danger"></ion-badge> -->
      </ion-tab-button>

      <ion-tab-button tab="task">
        <ion-icon [name]="currentUrl() === '/task' ? 'receipt' : 'receipt-outline'" />
        <ion-label>任務</ion-label>
        @if (taskStore.incompleteTaskCount() > 0) {
          <ion-badge color="danger">{{ taskStore.incompleteTaskCount() }}</ion-badge>
        }
      </ion-tab-button>
      <ion-tab-button tab="shop">
        <ion-icon [name]="currentUrl() === '/shop' ? 'leaf' : 'leaf-outline'" />
        <ion-label>兌換</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="collection">
        @if (currentUrl() === '/collection') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#ee6a17"
          >
            <path
              d="M280-80v-160H0l154-240H80l280-400 120 172 120-172 280 400h-74l154 240H680v160H520v-160h-80v160H280Z"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="none"
            stroke="#595959"
            stroke-width="60"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              transform="translate(48 -48) scale(0.9)"
              d="M280-80v-160H0l154-240H80l280-400 120 172 120-172 280 400h-74l154 240H680v160H520v-160h-80v160H280Z M480-708l160 228h-74l154 240H440"
            />
          </svg>
        }
        <ion-label>回憶林</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile">
        <ion-icon [name]="currentUrl() === '/profile' ? 'person' : 'person-outline'" />
        <ion-label>我的</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  }
</ion-tabs>

<app-companion [floor]="petFloor()?.nativeElement ?? null" />
