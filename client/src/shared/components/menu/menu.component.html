<ion-menu side="end" contentId="main-content" type="overlay">
  <ion-header class="menu-header">
    <ion-toolbar>
      <div class="profile-card">
        <div class="avatar">
          @if (userPortrait(); as portrait) {
            <img
              [src]="portrait"
              [alt]="userName() + ' 的頭像'"
              referrerpolicy="no-referrer"
              (error)="onPortraitError()"
            />
          } @else {
            <span aria-hidden="true">{{ userInitial() }}</span>
          }
        </div>
        <div class="profile-info">
          <span>{{ userName() }}</span>
          <span>{{ userEmail() }}</span>
        </div>
      </div>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list lines="none" class="menu-list">
      <ion-menu-toggle>
        <ion-item button routerLink="/profile" routerDirection="forward">
          <ion-icon slot="start" name="person-outline" />
          <ion-label>個人資料</ion-label>
        </ion-item>

        <ion-item button routerLink="/test" routerDirection="forward">
          <ion-icon slot="start" name="extension-puzzle-outline" />
          <ion-label>Demo 測試工具</ion-label>
        </ion-item>
        <ion-item button routerLink="/lobby" routerDirection="forward">
          <ion-icon slot="start" name="extension-puzzle-outline" />
          <ion-label>即時連線與生成式AI測試</ion-label>
        </ion-item>
        <!-- <ion-item button routerLink="/upload" routerDirection="forward">
          <ion-icon slot="start" name="extension-puzzle-outline" />
          <ion-label>storage上傳元件測試</ion-label>
        </ion-item> -->
        <ion-item button routerLink="/profile" routerDirection="forward">
          <ion-icon slot="start" name="person-outline" />
          <ion-label>設定</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>

    <div class="logout-area">
      <ion-menu-toggle>
        <ion-item button lines="none" class="logout-item" (click)="logOut()">
          <ion-icon slot="start" name="log-out-outline" />
          <ion-label>登出</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </div>
  </ion-content>
</ion-menu>
