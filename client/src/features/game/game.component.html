<ion-content class="ion-padding">
  @if (isPreparing()) {
    <ion-list>
      <ion-list-header>
        <h1>等待玩家加入中...</h1>
      </ion-list-header>
      @for (player of players(); track $index) {
        <ion-item>
          <ion-avatar slot="start">
            <img [alt]="player.displayName" [src]="player.photoUrl" />
          </ion-avatar>
          <ion-label>{{ player.displayName }}</ion-label>
        </ion-item>
      }
      <ion-item>
        <ion-button color="light">
          <ion-icon name="add"></ion-icon>
          <ion-label>邀請其他玩家加入</ion-label>
        </ion-button>
      </ion-item>
    </ion-list>
  }

  @if (isPlaying()) {
    <div class="title">
      <h1>題目</h1>
      <p>{{ topic() }}</p>
    </div>
    <ion-button>準備題目</ion-button>
  }
</ion-content>
