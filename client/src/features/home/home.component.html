<ion-content>
  <section class="floating-panel">
    @if (ws.isIdle() || ws.isCultivating() || ws.hasActiveRoute()) {
      <home-idle (start)="startPlanning()" (terminate)="requestRouteTermination()" />
    } @else if (ws.isPlanning()) {
      <home-plan
        [recommendationNow]="recommendationNow()"
        [recommendationsVisible]="showTreeRecommendations()"
        (toggleRecommendations)="toggleTreeRecommendations()"
        (back)="back()"
        (confirmRoute)="confirmRoute()"
        (confirmDestination)="confirmDestination()"
        (treeSelect)="selectDestination($event)"
        (routeRetry)="retryRoute()"
        (routeUpdate)="updateRoute()"
      />
    }

    @if (!ws.isPlanning()) {
      <ion-button
        class="recenter-button"
        shape="round"
        [color]="isCentered() ? 'primary' : 'light'"
        [attr.aria-pressed]="isCentered()"
        aria-label="回到目前位置"
        (click)="reCenter()"
      >
        <ion-icon
          slot="icon-only"
          [name]="isCentered() ? 'compass-outline' : 'locate-outline'"
        ></ion-icon>
      </ion-button>
      <app-joy-stick />
    }
  </section>

  <!-- 培養小樹彈窗 -->
  <home-cultivate
    (feedbackRequested)="showToast($event)"
    (destinationCheckIn)="confirmDestinationCheckIn()"
    (interactionDenied)="showInteractionWarning()"
    (closing)="dismissToast()"
  />
  <home-supply-station
    [station]="checkInStation()"
    (checkIn)="claimStationSupply()"
    (feedbackRequested)="showToast($event)"
    (closing)="dismissToast()"
    (closed)="closeStationCheckIn()"
  />
  @if (cultivationMessage()) {
    <p class="cultivation-message" role="alert">{{ cultivationMessage() }}</p>
  }

  <!-- 地圖本人 -->
  <app-home-map
    [visibleMapArea]="planningMapArea"
    [recommendedTrees]="planningRecommendations()"
    [showRecommendations]="showTreeRecommendations()"
    (bearingChange)="setMapBearing($event)"
    (destinationSelect)="selectDestination($event.toString())"
    (cultivationSelect)="openCultivation($event)"
    (taskToggle)="toggleTaskPoint($event)"
    (stationDetails)="openStationDetails($event)"
    (treeStopToggle)="toggleTreeStop($event)"
    (stationCheckIn)="openStationCheckIn($event)"
  />
</ion-content>
