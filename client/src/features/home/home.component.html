<ion-content>
  <section class="floating-panel">
    @if (isIdle()) {
      <home-idle (start)="startPlanning()" />
    } @else if (isPlanning()) {
      <home-choose (back)="back()" (go)="go()" />
    } @else if (isWalking()) {
      <home-walking (stop)="stop()" />
    } @else if (isArrived()) {}
  </section>
  @if (isWalking()) {
    <app-joy-stick />
  }
  <app-home-map (bearingChange)="joystickTransform().setMapBearing($event)" />
</ion-content>
