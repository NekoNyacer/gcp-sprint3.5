<div class="top">
  <ion-button size="medium" color="light" (click)="back.emit()">
    <ion-icon slot="icon-only" name="chevron-back-outline" class="arrow-back"></ion-icon>
  </ion-button>
  <ion-card class="destination-info">
    <ion-card-subtitle>目前目的地</ion-card-subtitle>
    <ion-card-title>板橋車站</ion-card-title>
    <div>
      <cub-badge name="time-outline"> 約 18 分鐘 </cub-badge>
      <cub-badge name="location-outline"> 1.2 公里 </cub-badge>
      <cub-badge name="bag-handle-outline" color="primary"> 2 優惠 </cub-badge>
    </div>
  </ion-card>
</div>
<ion-card class="bottom">
  <ion-card class="destination-confirm">
    <h5>已優化路線，沿途可補水並兌換商家優惠。</h5>
    <p>點擊「出發」後即可開始導航。</p>
    <ion-button color="primary" expand="block" (click)="go.emit()">
      <ion-icon name="walk"></ion-icon>
      <span>出發</span>
    </ion-button>
  </ion-card>
</ion-card>
