<div class="top" [class.top--compact]="hasActiveRoute()">
  <div class="resources">
    <ion-card aria-label="光能">
      <ion-icon name="sunny-outline"></ion-icon>
      <ion-card-title class="count">{{
        ps.inventory().lightEnergy | number: '1.0-0'
      }}</ion-card-title>
      <ion-card-subtitle>光能</ion-card-subtitle>
    </ion-card>
    <ion-card aria-label="水">
      <ion-icon name="water-outline"></ion-icon>
      <ion-card-title class="count">{{
        ps.inventory().waterDrops | number: '1.0-0'
      }}</ion-card-title>
      <ion-card-subtitle>水</ion-card-subtitle>
    </ion-card>
    <ion-card aria-label="肥料">
      <ion-icon name="sparkles-outline"></ion-icon>
      <ion-card-title class="count">{{
        ps.inventory().fertilizer | number: '1.0-0'
      }}</ion-card-title>
      <ion-card-subtitle>肥料</ion-card-subtitle>
    </ion-card>
  </div>
  <ion-card class="big-card">
    <ion-card-subtitle class="today-steps">今日步數</ion-card-subtitle>
    <ion-card-title class="today-steps-count">{{
      ps.todaySteps() | number: '1.0-0'
    }}</ion-card-title>
  </ion-card>
</div>

@if (hasActiveRoute()) {
  <button
    type="button"
    class="start-btn terminate-btn"
    [class.holding]="holding()"
    aria-label="中止本次路線，長按一秒"
    (pointerdown)="beginPointerHold($event)"
    (pointermove)="movePointer($event)"
    (pointerup)="endPointerHold($event)"
    (pointercancel)="endPointerHold($event)"
    (lostpointercapture)="endPointerHold($event)"
    (keydown)="beginKeyHold($event)"
    (keyup)="endKeyHold($event)"
    (blur)="cancelHold()"
    (contextmenu)="$event.preventDefault()"
  >
    <ion-icon name="stop-circle-outline"></ion-icon>
    <span>中止本次路線</span>
  </button>
} @else {
  <ion-button class="start-btn" color="primary" expand="block" (click)="start.emit()">
    <ion-icon name="walk"></ion-icon>
    <span>開始散步</span>
  </ion-button>
}
