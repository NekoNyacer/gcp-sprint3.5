<ion-card
  [button]="interactive()"
  [attr.aria-label]="interactive() ? '查看 ' + tree().name : null"
  (click)="select()"
>
  <img
    [alt]="tree().species"
    [src]="image()"
  />
  <legend>
    <div>
      <ion-label color="secondary">{{ tree().name }}</ion-label>
      <ion-chip [color]="tree().canHarvest ? 'primary' : 'medium'">{{ tree().harvested ? '已收成' : tree().canHarvest ? '可收成' : tree().stage }}</ion-chip>
    </div>
    <p>{{ tree().location }}</p>
    <p>{{ tree().species }} · {{ tree().stage }}</p>
    <p>種植於 {{ tree().plantedAt | date: 'yyyy/MM/dd' : '+0800' }}</p>
  </legend>
</ion-card>
