<ion-card>
  <img
    alt="Silhouette of mountains"
    src="https://ionicframework.com/docs/img/demos/card-media.png"
  />
  <ion-card-header>
    <ion-card-title>{{ tree().name }}</ion-card-title>
    <ion-card-subtitle>{{ tree().location }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <div class="growthPercentage"></div>
  </ion-card-content>
</ion-card>
